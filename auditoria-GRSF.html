<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Auditoría GZSF · BanCoppel</title>
<style>
  :root {
    --azul:    #1B3A6B;
    --azul2:   #2563A8;
    --rojo:    #C0392B;
    --verde:   #1A7A4A;
    --amarillo:#B7791F;
    --gris:    #F4F6F9;
    --borde:   #DDE3EC;
    --texto:   #1A2233;
    --claro:   #FFFFFF;
    --prohib:  #FEE2E2;
    --ok-bg:   #ECFDF5;
    --warn-bg: #FFFBEB;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gris);
    color: var(--texto);
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: 100px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--azul);
    color: white;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .header h1 { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  .header p  { font-size: 11px; opacity: .75; margin-top: 2px; }

  /* ── PROGRESO ── */
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4ADE80;
    border-radius: 2px;
    transition: width .3s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 10px;
    opacity: .8;
    margin-top: 4px;
    text-align: right;
  }

  /* ── TABS DE SECCIÓN ── */
  .tabs {
    display: flex;
    overflow-x: auto;
    background: var(--azul2);
    padding: 0 8px;
    gap: 2px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,.6);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all .2s;
  }
  .tab.active {
    color: white;
    border-bottom-color: #4ADE80;
  }
  .tab .badge {
    display: inline-block;
    background: rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 1px 6px;
    font-size: 10px;
    margin-left: 4px;
  }
  .tab.tiene-incumplidos .badge { background: #EF4444; color: white; }

  /* ── BLOQUE DE IDENTIFICACIÓN ── */
  .ident {
    background: white;
    margin: 12px;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid var(--borde);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .ident h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--azul);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .campo { margin-bottom: 10px; }
  .campo label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: #64748B;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .campo select,
  .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    font-size: 14px;
    background: var(--gris);
    color: var(--texto);
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: border-color .2s;
  }
  .campo select:focus,
  .campo input:focus { border-color: var(--azul2); background: white; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── SECCIÓN DE ÍTEMS ── */
  .seccion {
    display: none;
    padding: 0 12px;
  }
  .seccion.activa { display: block; }

  .subseccion {
    margin-bottom: 6px;
    margin-top: 12px;
  }
  .subseccion-titulo {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: #94A3B8;
    padding: 0 4px;
    margin-bottom: 6px;
  }

  /* ── TARJETA DE ÍTEM ── */
  .item {
    background: white;
    border-radius: 10px;
    border: 1.5px solid var(--borde);
    margin-bottom: 6px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .item.prohibicion {
    border-left: 4px solid var(--rojo);
    background: var(--prohib);
  }
  .item.cumple    { border-color: #BBF7D0; background: var(--ok-bg); }
  .item.incumple  { border-color: #FCA5A5; background: #FEF2F2; }

  .item-content {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
  }
  .item-id {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    color: var(--azul2);
    background: #EFF6FF;
    border-radius: 5px;
    padding: 2px 6px;
    margin-top: 2px;
    min-width: 36px;
    text-align: center;
  }
  .item.prohibicion .item-id {
    background: #FEE2E2;
    color: var(--rojo);
  }
  .item-texto {
    flex: 1;
    font-size: 13px;
    line-height: 1.45;
    color: var(--texto);
  }
  .item.prohibicion .item-texto { font-weight: 500; }

  /* ── BOTONES SI / NO / NA ── */
  .item-botones {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px 12px;
  }
  .btn-check {
    flex: 1;
    padding: 9px 4px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    color: #64748B;
  }
  .btn-check:active { transform: scale(.96); }

  .btn-check.si  { border-color: #86EFAC; color: #15803D; background: white; }
  .btn-check.no  { border-color: #FCA5A5; color: #B91C1C; background: white; }
  .btn-check.na  { border-color: #CBD5E1; color: #94A3B8; background: white; }

  .btn-check.si.sel  { background: #DCFCE7; border-color: #22C55E; color: #15803D; }
  .btn-check.no.sel  { background: #FEE2E2; border-color: #EF4444; color: #B91C1C; font-weight: 700; }
  .btn-check.na.sel  { background: #F1F5F9; border-color: #94A3B8; color: #64748B; }

  /* Prohibición: si=incumplimiento → rojo más fuerte */
  .item.prohibicion .btn-check.si.sel {
    background: #FEE2E2; border-color: #EF4444; color: #B91C1C; font-weight: 700;
  }
  .item.prohibicion .btn-check.no.sel {
    background: #DCFCE7; border-color: #22C55E; color: #15803D;
  }

  /* ── OBSERVACIONES ── */
  .obs-campo {
    background: white;
    border-radius: 10px;
    border: 1.5px solid var(--borde);
    margin: 12px 0;
    padding: 12px;
  }
  .obs-campo label {
    font-size: 11px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: .4px;
    display: block;
    margin-bottom: 6px;
  }
  .obs-campo textarea {
    width: 100%;
    min-height: 80px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    background: var(--gris);
  }
  .obs-campo textarea:focus { border-color: var(--azul2); background: white; }

  /* ── NAVEGACIÓN INFERIOR ── */
  .nav-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid var(--borde);
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .btn-nav {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-nav:active { transform: scale(.97); }
  .btn-prev { background: var(--gris); color: var(--texto); }
  .btn-next { background: var(--azul); color: white; }
  .btn-enviar { background: var(--verde); color: white; flex: 2; }

  /* ── RESUMEN FINAL ── */
  .resumen {
    display: none;
    padding: 12px;
  }
  .resumen.activo { display: block; }
  .resumen-header {
    background: var(--azul);
    color: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
    text-align: center;
  }
  .resumen-header h2 { font-size: 18px; margin-bottom: 4px; }
  .resumen-header p  { font-size: 12px; opacity: .8; }
  .pct-grande {
    font-size: 48px;
    font-weight: 800;
    margin: 12px 0 4px;
  }
  .pct-grande.verde  { color: #4ADE80; }
  .pct-grande.amarillo { color: #FCD34D; }
  .pct-grande.rojo   { color: #FCA5A5; }

  .resumen-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .resumen-card {
    background: white;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1.5px solid var(--borde);
  }
  .resumen-card .numero {
    font-size: 24px;
    font-weight: 800;
    display: block;
  }
  .resumen-card .etiqueta { font-size: 10px; color: #64748B; font-weight: 600; text-transform: uppercase; }
  .resumen-card.verde-c  { border-color: #86EFAC; }
  .resumen-card.rojo-c   { border-color: #FCA5A5; }
  .resumen-card.prohib-c { border-color: var(--rojo); }
  .resumen-card.verde-c  .numero { color: var(--verde); }
  .resumen-card.rojo-c   .numero { color: #DC2626; }
  .resumen-card.prohib-c .numero { color: var(--rojo); }

  .incumplidos-lista {
    background: white;
    border-radius: 10px;
    border: 1.5px solid var(--borde);
    padding: 14px;
    margin-bottom: 12px;
  }
  .incumplidos-lista h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--texto);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 10px;
  }
  .item-incumplido {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 7px 0;
    border-bottom: 1px solid var(--borde);
    font-size: 12px;
  }
  .item-incumplido:last-child { border-bottom: none; }
  .item-incumplido .id-badge {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 5px;
    background: #FEE2E2;
    color: var(--rojo);
  }
  .item-incumplido .id-badge.prohib { background: var(--rojo); color: white; }

  .btn-enviar-final {
    width: 100%;
    padding: 16px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-volver {
    width: 100%;
    padding: 12px;
    background: var(--gris);
    color: var(--texto);
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }

  /* ── PANTALLA DE ÉXITO ── */
  .exito {
    display: none;
    text-align: center;
    padding: 60px 24px;
  }
  .exito.activo { display: block; }
  .exito .icono { font-size: 64px; margin-bottom: 16px; }
  .exito h2 { font-size: 22px; font-weight: 800; color: var(--verde); margin-bottom: 8px; }
  .exito p  { color: #64748B; font-size: 14px; margin-bottom: 24px; }
  .exito .btn-nueva {
    padding: 14px 32px;
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1E293B;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all .3s;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<!-- NAVEGACIÓN INFERIOR -->
<div class="nav-bottom" id="navBottom">

</div>

// ── ESTADO DE LA APP ─────────────────────────────────────────
const respuestas = {}; // { id: 'SI'|'NO'|'NA' }
let seccionActual = 0;
const TOTAL_SECCIONES = 6; // 0=datos, 1-5=ítems, 6=resumen

// ── CATÁLOGO PLANO DE ÍTEMS ──────────────────────────────────
const todosItems = [];
SECCIONES.forEach(sec => {
  sec.subsecciones.forEach(sub => {
    sub.items.forEach(item => todosItems.push(item));
  });
});

// ── FILTRAR SUCURSALES POR ZONA ──────────────────────────────
function filtrarSucursales() {
  const zona = document.getElementById('zona').value;
  const sel  = document.getElementById('sucursal');
  sel.innerHTML = '<option value="">— Selecciona sucursal —</option>';
  if (!zona || !SUCURSALES[zona]) return;
  SUCURSALES[zona].forEach(([no, nombre]) => {
    const opt = document.createElement('option');
    opt.value = `${no} · ${nombre}`;
    opt.textContent = `${no} · ${nombre}`;
    sel.appendChild(opt);
  });
}

// ── CONSTRUIR SECCIONES EN EL DOM ────────────────────────────
function construirSecciones() {
  SECCIONES.forEach((sec, si) => {
    const cont = document.getElementById(`sec${si + 1}`);
    let html = '';
    sec.subsecciones.forEach(sub => {
      html += `<div class="subseccion">
        <div class="subseccion-titulo">${sub.titulo}</div>`;
      sub.items.forEach(item => {
        const esP = !!item.prohibicion;
        html += `
        <div class="item${esP ? ' prohibicion' : ''}" id="item_${item.id}">
          <div class="item-content">
            <span class="item-id">${item.id}</span>
            <span class="item-texto">${esP ? '⛔ ' : ''}${item.texto}</span>
          </div>
          <div class="item-botones">
            <button class="btn-check si"  onclick="responder('${item.id}','SI',  this, ${esP})">
              ${esP ? '✅ NO ocurrió' : '✅ SÍ'}
            </button>
            <button class="btn-check no"  onclick="responder('${item.id}','NO',  this, ${esP})">
              ${esP ? '⛔ SÍ ocurrió' : '❌ NO'}
            </button>
            <button class="btn-check na"  onclick="responder('${item.id}','NA',  this, ${esP})">
              N/A
            </button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    // Observaciones al final de cada sección
    html += `<div class="obs-campo">
      <label>Observaciones · ${sec.nombre}</label>
      <textarea id="obs_sec${si+1}" placeholder="Anotar hallazgos, áreas de oportunidad y acciones correctivas…"></textarea>
    </div>`;
    cont.innerHTML = html;
  });
}

// ── OBSERVACIONES POR ÍTEM ───────────────────────────────────
const obsItems = {};

// ── RESPONDER UN ÍTEM ────────────────────────────────────────
function responder(id, valor, btn, esProhib) {
  respuestas[id] = valor;

  const itemEl = document.getElementById('item_' + id);
  const btns   = itemEl.querySelectorAll('.btn-check');
  btns.forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');

  // Color de la tarjeta
  itemEl.classList.remove('cumple','incumple');
  if (valor === 'SI' && !esProhib) itemEl.classList.add('cumple');
  else if (valor === 'NO' && !esProhib) itemEl.classList.add('incumple');
  else if (valor === 'SI' && esProhib)  itemEl.classList.add('cumple');
  else if (valor === 'NO' && esProhib)  itemEl.classList.add('incumple');

  // Campo de observación obligatorio cuando NO o NA
  let obsDiv = itemEl.querySelector('.obs-item');
  const necesitaObs = (valor === 'NO' || valor === 'NA');

  if (necesitaObs && !obsDiv) {
    obsDiv = document.createElement('div');
    obsDiv.className = 'obs-item';
    const etiqueta = valor === 'NO'
      ? (esProhib ? '\u26d4 Describe la situaci\u00f3n encontrada (obligatorio):' : '\u274c Motivo del incumplimiento (obligatorio):')
      : '\ud83d\udcdd Motivo de N/A (obligatorio):';
    obsDiv.innerHTML =
      '<div style="padding:0 12px 10px">' +
      '<label style="font-size:11px;font-weight:700;color:#B91C1C;display:block;margin-bottom:4px">' + etiqueta + '</label>' +
      '<textarea id="obs_item_' + id + '" placeholder="Describe brevemente la situaci\u00f3n o motivo\u2026"' +
      ' onchange="obsItems['' + id + ''] = this.value" oninput="obsItems['' + id + ''] = this.value"' +
      ' style="width:100%;border:1.5px solid #FCA5A5;border-radius:8px;padding:8px;' +
      'font-size:13px;font-family:inherit;min-height:60px;resize:vertical;background:#FFF5F5;outline:none"></textarea>' +
      '</div>';
    itemEl.appendChild(obsDiv);
  } else if (!necesitaObs && obsDiv) {
    obsDiv.remove();
    delete obsItems[id];
  }

  if (valor === 'SI') delete obsItems[id];

  actualizarProgreso();
  actualizarBadges();
}

// ── PROGRESO GLOBAL ──────────────────────────────────────────
function actualizarProgreso() {
  const total     = todosItems.length;
  const respondidos = Object.keys(respuestas).length;
  const pct = Math.round((respondidos / total) * 100);
  document.getElementById('progFill').style.width  = pct + '%';
  document.getElementById('progLabel').textContent = `${respondidos} de ${total} respondidos · ${pct}%`;
}

// ── BADGES EN TABS ───────────────────────────────────────────
function actualizarBadges() {
  SECCIONES.forEach((sec, si) => {
    let incumplidos = 0;
    sec.subsecciones.forEach(sub => {
      sub.items.forEach(item => {
        const r = respuestas[item.id];
        if (!r) return;
        const esP = !!item.prohibicion;
        if (esP && r === 'NO') incumplidos++;
        if (!esP && r === 'NO') incumplidos++;
      });
    });
    const badge  = document.getElementById(`b${si+1}`);
    const tabEl  = document.querySelectorAll('.tab')[si+1];
    badge.textContent = incumplidos || '';
    tabEl.classList.toggle('tiene-incumplidos', incumplidos > 0);
  });
}

// ── NAVEGACIÓN ───────────────────────────────────────────────
function irSeccion(n) {
  // Ocultar todo
  document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('secResumen').classList.remove('activo');
  document.getElementById('pantallaExito').classList.remove('activo');
  document.getElementById('navBottom').style.display = 'flex';

  seccionActual = n;

  if (n <= 5) {
    document.getElementById(`sec${n}`).classList.add('activa');
  } else {
    generarResumen();
    document.getElementById('secResumen').classList.add('activo');
    document.getElementById('navBottom').style.display = 'none';
  }

  document.querySelectorAll('.tab')[n].classList.add('active');
  document.getElementById('btnPrev').style.display = n > 0 ? 'block' : 'none';

  const btnNext = document.getElementById('btnNext');
  if (n < 5) {
    btnNext.textContent = 'Siguiente →';
    btnNext.className = 'btn-nav btn-next';
  } else {
    btnNext.textContent = '✅ Ver resumen';
    btnNext.className = 'btn-nav btn-enviar';
  }

  // Scroll arriba
  window.scrollTo(0, 0);
  document.querySelectorAll('.tabs')[0].children[n].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function siguiente() {
  if (seccionActual === 0 && !validarIdentificacion()) return;
  // Al intentar ir al resumen, validar ítems sin responder
  if (seccionActual === 5) {
    const pendientes = todosItems.filter(item => !respuestas[item.id]);
    if (pendientes.length > 0) {
      mostrarModalPendientes(pendientes);
      return;
    }
    // Validar que NO y NA tengan observación
    const sinObs = todosItems.filter(item => {
      const r = respuestas[item.id];
      return (r === 'NO' || r === 'NA') && !obsItems[item.id];
    });
    if (sinObs.length > 0) {
      mostrarToast('\u26a0\ufe0f ' + sinObs.length + ' ítem(s) con NO o N/A requieren observación');
      // Resaltar campos vacíos
      sinObs.forEach(item => {
        const ta = document.getElementById('obs_item_' + item.id);
        if (ta) { ta.style.border = '2px solid #EF4444'; ta.focus(); }
      });
      return;
    }
  }
  irSeccion(Math.min(seccionActual + 1, 6));
}

// ── MODAL DE ÍTEMS PENDIENTES ─────────────────────────────────
function mostrarModalPendientes(pendientes) {
  // Agrupar por sección
  const grupos = {};
  pendientes.forEach(item => {
    SECCIONES.forEach((sec, si) => {
      sec.subsecciones.forEach(sub => {
        if (sub.items.find(i => i.id === item.id)) {
          if (!grupos[sec.nombre]) grupos[sec.nombre] = { sec: si+1, items: [] };
          grupos[sec.nombre].items.push(item);

      });
    });

  let listaHTML = '';
  Object.entries(grupos).forEach(([secNombre, g]) => {
    listaHTML += '<div style="margin-bottom:10px">';
    listaHTML += '<div style="font-size:11px;font-weight:700;color:#1B3A6B;text-transform:uppercase;margin-bottom:4px">' + secNombre + '</div>';
    g.items.forEach(item => {
      listaHTML += '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #EEE;font-size:12px">' +
        '<span style="background:#FEE2E2;color:#B91C1C;font-weight:700;font-size:10px;padding:2px 6px;border-radius:4px;flex-shrink:0">' + item.id + '</span>' +
        '<span>' + item.texto.substring(0, 60) + (item.texto.length > 60 ? '…' : '') + '</span>' +
        '</div>';
    });

  });

  const modal = document.createElement('div');
  modal.id = 'modalPendientes';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:flex-end;padding:0';
  modal.innerHTML =
    '<div style="background:white;border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
    '<div>' +
    '<div style="font-size:16px;font-weight:800;color:#B91C1C">⚠️ ' + pendientes.length + ' ítems sin responder</div>' +
    '<div style="font-size:12px;color:#64748B;margin-top:2px">Estos ítems quedarán como omitidos y se reportará al Gerente de Zona</div>' +
    '</div>' +
    '<button onclick="document.getElementById('modalPendientes').remove()" style="background:#F1F5F9;border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer">✕</button>' +
    '</div>' +
    '<div style="margin-bottom:14px">' + listaHTML + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
    '<button onclick="document.getElementById('modalPendientes').remove()" ' +
    'style="padding:12px;background:#1B3A6B;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">← Volver a completar</button>' +

    '</div>' +
    '</div>';
  document.body.appendChild(modal);
}

function forzarResumen() {
  // Marcar pendientes como omitidos en el payload pero permitir continuar
  irSeccion(6);
}
function anterior() {
  irSeccion(Math.max(seccionActual - 1, 0));
}

function validarIdentificacion() {
  const zona = document.getElementById('zona').value;
  const suc  = document.getElementById('sucursal').value;
  const gf   = document.getElementById('gf').value.trim();
  const gzsf = document.getElementById('gzsf').value.trim();
  const fecha= document.getElementById('fecha').value;
  if (!zona || !suc || !gf || !gzsf || !fecha) {
    mostrarToast('⚠️ Completa todos los campos antes de continuar');
    return false;
  }
  return true;
}

// ── GENERAR RESUMEN ──────────────────────────────────────────
function generarResumen() {
  let cumple = 0, incumple = 0, prohibViol = 0, total = 0;
  const itemsIncumplidos = [];
  const itemsOmitidos    = [];
  const itemsNA          = [];

  todosItems.forEach(item => {
    const r = respuestas[item.id];
    const esP = !!item.prohibicion;
    if (!r) {
      itemsOmitidos.push(item);
      return;
    }
    if (r === 'NA') {
      itemsNA.push({...item, obs: obsItems[item.id] || ''});
      return;
    }
    total++;
    if (esP) {
      if (r === 'SI') cumple++;
      else { incumple++; prohibViol++; itemsIncumplidos.push({...item, tipo:'prohibicion', obs: obsItems[item.id] || ''}); }
    } else {
      if (r === 'SI') cumple++;
      else { incumple++; itemsIncumplidos.push({...item, tipo:'normal', obs: obsItems[item.id] || ''}); }
    }
  });

  const pct    = total > 0 ? Math.round((cumple / total) * 100) : 0;
  const estado = pct >= 90 ? '✅ ACEPTABLE' : pct >= 70 ? '⚠️ REQUIERE ATENCIÓN' : '🚨 CRÍTICO';
  const clsPct = pct >= 90 ? 'verde' : pct >= 70 ? 'amarillo' : 'rojo';

  const zona  = document.getElementById('zona').value;
  const suc   = document.getElementById('sucursal').value;
  const gf    = document.getElementById('gf').value;
  const gzsf  = document.getElementById('gzsf').value;
  const fecha = document.getElementById('fecha').value;

  const listaInc = itemsIncumplidos.map(item => `
    <div class="item-incumplido">
      <span class="id-badge${item.tipo==='prohibicion'?' prohib':''}">${item.id}</span>
      <span>${item.texto}</span>
    </div>`).join('') || '<p style="color:#94A3B8;font-size:13px;padding:8px 0">Sin incumplimientos detectados 🎉</p>';

  // Observaciones consolidadas
  let obsHtml = '';
  SECCIONES.forEach((sec, si) => {
    const obs = document.getElementById(`obs_sec${si+1}`)?.value.trim();
    if (obs) obsHtml += `<div style="margin-bottom:8px"><strong>${sec.nombre}:</strong><br><span style="color:#475569">${obs}</span></div>`;
  });

  document.getElementById('secResumen').innerHTML =
    '<div class="resumen-header">' +
    '<p>' + zona + ' · ' + suc + '</p>' +
    '<p style="font-size:12px;opacity:.7">' + fecha + ' · GF: ' + gf + ' · GZSF: ' + gzsf + '</p>' +
    '<div class="pct-grande ' + clsPct + '">' + pct + '%</div>' +
    '<p style="font-size:14px;font-weight:700">' + estado + '</p>' +
    (itemsOmitidos.length > 0 ? '<div style="background:#FEF3C7;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:12px;font-weight:600;color:#B7791F">⚠️ ' + itemsOmitidos.length + ' ítems sin respuesta — notificado al Gerente de Zona</div>' : '') +
    '</div>' +
    '<div class="resumen-grid">' +
    '<div class="resumen-card verde-c"><span class="numero">' + cumple + '</span><span class="etiqueta">✅ Cumple</span></div>' +
    '<div class="resumen-card rojo-c"><span class="numero">' + incumple + '</span><span class="etiqueta">❌ Incumple</span></div>' +
    '<div class="resumen-card prohib-c"><span class="numero">' + prohibViol + '</span><span class="etiqueta">⛔ Prohib.</span></div>' +
    '</div>' +
    '<div class="incumplidos-lista">' +
    '<h3>❌ Ítems incumplidos (' + itemsIncumplidos.length + ')</h3>' +
    listaInc +
    '</div>' +
    listaOmit +
    (obsHtml ? '<div class="incumplidos-lista"><h3>\ud83d\udcdd Observaciones generales</h3>' + obsHtml + '</div>' : '') +
    '<button class="btn-enviar-final" onclick="enviarDatos()">\ud83d\udce4 Enviar auditoría al sistema</button>' +
    '<button class="btn-volver" onclick="irSeccion(5)">\u2190 Volver y corregir</button>' +
    '<br><br>';
}

// ── ENVIAR DATOS AL GOOGLE SHEET ─────────────────────────────
// INSTRUCCIÓN: Reemplaza SCRIPT_URL con la URL de tu Apps Script Web App
// Para generar esa URL: en Apps Script → Implementar → Nueva implementación →
// Tipo: Aplicación web → Ejecutar como: Yo → Acceso: Cualquier persona → Implementar
const SCRIPT_URL = "PEGA_AQUI_TU_SCRIPT_URL";

async function enviarDatos() {
  const btnEnv = document.querySelector('.btn-enviar-final');
  btnEnv.textContent = '⏳ Enviando…';
  btnEnv.disabled = true;

  const payload = {
    zona:     document.getElementById('zona').value,
    sucursal: document.getElementById('sucursal').value,
    gf:       document.getElementById('gf').value,
    gzsf:     document.getElementById('gzsf').value,
    fecha:    document.getElementById('fecha').value,
    bitSeg1:  document.getElementById('bitSeg1').value,
    bitSeg2:  document.getElementById('bitSeg2').value,
    respuestas: respuestas,
    observaciones: {},
    observacionesItems: obsItems,
    itemsOmitidos: todosItems.filter(i => !respuestas[i.id]).map(i => i.id)
  };

  SECCIONES.forEach((sec, si) => {
    const el = document.getElementById('obs_sec' + (si+1));
    const obs = el ? el.value.trim() : '';
    if (obs) payload.observaciones[sec.nombre] = obs;
  });

  // Si no hay URL configurada, simular envío exitoso
  if (SCRIPT_URL === "PEGA_AQUI_TU_SCRIPT_URL") {
    setTimeout(() => {
      document.getElementById('secResumen').classList.remove('activo');
      document.getElementById('pantallaExito').classList.add('activo');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    }, 1200);
    return;
  }

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode:   'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    document.getElementById('secResumen').classList.remove('activo');
    document.getElementById('pantallaExito').classList.add('activo');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  } catch (e) {
    btnEnv.textContent = '📤 Enviar auditoría al sistema';
    btnEnv.disabled = false;
    mostrarToast('❌ Error al enviar. Revisa tu conexión.');
  }
}

// ── NUEVA AUDITORÍA ──────────────────────────────────────────
function nuevaAuditoria() {
  Object.keys(respuestas).forEach(k => delete respuestas[k]);
  document.getElementById('zona').value = '';
  document.getElementById('sucursal').innerHTML = '<option value="">— Primero selecciona zona —</option>';
  ['gf','gzsf','fecha','bitSeg1','bitSeg2'].forEach(id => document.getElementById(id).value = '');
  construirSecciones();
  actualizarProgreso();
  actualizarBadges();
  document.getElementById('pantallaExito').classList.remove('activo');
  irSeccion(0);
}

// ── TOAST ────────────────────────────────────────────────────
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── INIT ─────────────────────────────────────────────────────
construirSecciones();
actualizarProgreso();
document.getElementById('fecha').valueAsDate = new Date();
</script>
